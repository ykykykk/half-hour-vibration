plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yk.halfhour'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yk.halfhour'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // 固定签名：以后每次构建出来的 APK 都能直接覆盖安装，不用先卸载
    signingConfigs {
        fixed {
            storeFile file('halfhour.keystore')
            storePassword 'halfhour'
            keyAlias 'halfhour'
            keyPassword 'halfhour'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
