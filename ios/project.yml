name: HalfHour
options:
  bundleIdPrefix: com.yk
  deploymentTarget:
    iOS: '16.0'
packages:
  HalfHourCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  HalfHour:
    type: application
    platform: iOS
    sources: [HalfHour]
    dependencies:
      - package: HalfHourCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yk.halfhour.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 半小时休息
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme:
      gatherCoverageData: false
